<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>watermarkCanvas</title>
    <style>
      body {
        margin: 0;
        padding: 40px;
        font-family: Arial, "Microsoft YaHei", sans-serif;
        background-color: #f5f5f5;
      }

      /* 需要添加水印的目标区域 */
      #contain {
        position: relative;
        width: 400px;
        height: 260px;
        margin: 0 auto;
        padding: 20px;
        box-sizing: border-box;
        background-color: skyblue;
        color: #fff;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="contain">
      水印展示
    </div>

    <script>
       /**
       * 给指定元素添加文字水印
       * @param {Object} options - 配置项
       * @param {string} options.elementId - 目标元素 id
       * @param {string} options.watermarkText - 水印文字
       * @param {number} [options.canvasWidth=220] - 单个水印块宽度
       * @param {number} [options.canvasHeight=160] - 单个水印块高度
       * @param {string} [options.font='16px Microsoft YaHei'] - 文字样式
       * @param {string} [options.fillStyle='rgba(255,255,255,0.18)'] - 文字颜色
       * @param {number} [options.rotateDeg=-20] - 旋转角度（单位：度）
       */
      function addWatermark(options) {
        const {
          elementId,
          watermarkTest,
          canvasWidth= 200,
          canvasHeight = 100,
          font = "16px Microsoft YaHei",
          fillStyle = "rgba(255,255,255,0.2)",
          rotateDeg = -25,
        } = options;
        const targetElement = document.getElementById(elementId);


        const watermarkCanvas = document.createElement("canvas");

        watermarkCanvas.width = canvasWidth;
        watermarkCanvas.height = canvasHeight;

        const contenxt = watermarkCanvas.getContext("2d");

        contenxt.font = font;
        contenxt.fillStyle = fillStyle;
        // 居中
        contenxt.textAlign = 'center';
        contenxt.textBaseline = 'middle';

        // 中心
        contenxt.transform(canvasWidth / 2, canvasHeight / 2);

        const rotateRad = (rotateDeg * Math.PI) / 180;
        contenxt.rotate(rotateRad);

        // 开始写
        contenxt.fillText(watermarkTest, 0, 0);

        // 加入图片
        const base64Url = watermarkCanvas.toDataURL('image/png');

        // 加入目标元素
        targetElement.style.backgroundImage = `url(${base64Url})`;
        targetElement.style.backgroundRepeat = 'repeat';
        targetElement.style.backgroundPosition = '0 0';


      }

      addWatermark({
        elementId: "contain",
        watermarkTest: "公司名称",
        canvasWidth: 200,
        canvasHeight: 100,
        font: "18px 宋体",
        fillStyle: "rgba(255, 255, 255, 0.25)",
        rotateDeg: -25,
      });
    </script>
  </body>
</html>
