<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas Watermark Demo</title>
  <style>
    /* 页面只是为了演示效果 */
    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background-color: #f5f5f5;
    }

    /* 需要添加水印的目标区域 */
    #watermark-container {
      position: relative;
      width: 400px;
      height: 260px;
      margin: 0 auto;
      padding: 20px;
      box-sizing: border-box;
      background-color: #4a90e2;
      color: #fff;
      border-radius: 8px;
      overflow: hidden;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .content h2 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <!-- 目标容器 -->
  <div id="watermark-container">
    <div class="content">
      <h2>前端水印效果演示</h2>
      <p>这个区域添加了重复平铺的文字水印。</p>
      <p>水印由 canvas 动态生成，再作为背景图铺满整个容器。</p>
    </div>
  </div>

  <script>
    /**
     * 给指定元素添加文字水印
     * @param {Object} options - 配置项
     * @param {string} options.elementId - 目标元素 id
     * @param {string} options.watermarkText - 水印文字
     * @param {number} [options.canvasWidth=220] - 单个水印块宽度
     * @param {number} [options.canvasHeight=160] - 单个水印块高度
     * @param {string} [options.font='16px Microsoft YaHei'] - 文字样式
     * @param {string} [options.fillStyle='rgba(255,255,255,0.18)'] - 文字颜色
     * @param {number} [options.rotateDeg=-20] - 旋转角度（单位：度）
     */
    function addWatermark(options) {
      const {
        elementId,
        watermarkText,
        canvasWidth = 220,
        canvasHeight = 160,
        font = '16px Microsoft YaHei',
        fillStyle = 'rgba(255, 255, 255, 0.18)',
        rotateDeg = -20
      } = options;

      // 1. 获取目标容器
      const targetElement = document.getElementById(elementId);
      if (!targetElement) {
        console.error('未找到目标元素：', elementId);
        return;
      }

      // 2. 创建 canvas 画布
      // 动态创建 canvas：canvas 相当于一张临时画布，我们先把“水印文字”画到这张画布上
      const watermarkCanvas = document.createElement('canvas');
      // 设置 canvas 大小（“单个水印块”的大小）
      watermarkCanvas.width = canvasWidth;
      watermarkCanvas.height = canvasHeight;

      // 3. 获取 2D 绘图上下文
      //1）拿到 画笔对象（在 canvas 上写字、旋转、设置颜色）
      const context = watermarkCanvas.getContext('2d');
      if (!context) {
        console.error('当前浏览器不支持 canvas 2D');
        return;
      }

      // 4. 配置文字样式
      context.font = font;
      context.fillStyle = fillStyle;
      context.textAlign = 'center';  // 水平居中
      context.textBaseline = 'middle';  // 垂直居中

      // 5. 将 坐标原点 移动到 画布中心（旋转时会围绕中心旋转）
      context.translate(canvasWidth / 2, canvasHeight / 2);

      // 6. 角度转弧度：弧度 = 角度 * Math.PI / 180
      const rotateRad = (rotateDeg * Math.PI) / 180;
      context.rotate(rotateRad);

      // 7. 在画布中心，写入文字
      // 因为已经 translate 到中心，所以这里写 (0, 0)
      context.fillText(watermarkText, 0, 0);

      // 8. 将 canvas 转成 base64 图片
      const base64Url = watermarkCanvas.toDataURL('image/png');

      // 9. 设置为目标元素的背景图，并重复平铺
      targetElement.style.backgroundImage = `url(${base64Url})`;
      targetElement.style.backgroundRepeat = 'repeat';
      targetElement.style.backgroundPosition = '0 0';
    }

    // 调用函数，给容器添加水印
    addWatermark({
      elementId: 'watermark-container',
      watermarkText: '公司名称',
      canvasWidth: 220,
      canvasHeight: 160,
      font: '18px Microsoft YaHei',
      fillStyle: 'rgba(255, 255, 255, 0.2)',
      rotateDeg: -25
    });
  </script>
</body>
</html>
