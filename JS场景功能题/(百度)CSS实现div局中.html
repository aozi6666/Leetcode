<!-- 
    CSS 居中： 使用 CSS 实现一个 div 的水平垂直居中
-->


<!-- 方案1 ： flex 布局 -->


<html>
    <head>
        <title>CSS居中</title>
        <style>
          * {
            padding: 0;
            margin: 0;
          }
          .parent{
            width: 300px;
            height: 300px;
            background-color: skyblue;

            display: flex;

            justify-content: center;
            align-items: center;
          }
          .child {
            width: 200px;
            height: 200px;
            background-color: pink;

            text-align: center;
            line-height: 200px;
          }
        </style>
    </head>
    <body>
        <div class="parent">
            <div class="child">水平垂直居中</div>
        </div>
    </body>
</htmL>
