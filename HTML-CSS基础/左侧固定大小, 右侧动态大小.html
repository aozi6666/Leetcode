<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>左侧固定大小, 右侧动态大小</title>
        <style>
           .parent {
            display: flex
           }
           .left {
            height: 100vh;
            display: 0 0 700px;
            background-color: #f0f0f0;
           }
           .right {
            flex: 1 1 0%;
            background-color: skyblue;
           }
        </style>
    </head>
    <body>
        <div class="parent">
            <div class="left">left</div>
            <div class="right">right</div>
        </div>
    </body>
</html>
