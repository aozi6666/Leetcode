<!DOCTYPE html>
<html lang="zh-CN">
    <hend>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
        <title>三栏布局</title>
        <style type="text/css">
            *{
                margin: 0;
                padding: 0;
            }

            .containter{
                /* 父容器：开启flex布局 */
                display: flex;   

                /* 水平-垂直 */
                justify-content: center;
                align-items: center;
            }
            
            /* 左右两侧固定像素 */
            .left, .right{
                width: 200px;

                border: 1px solid black;
            }
            
            .main{
                /* 中间内容区：自动填充剩余空间 */
                flex: 1;

                border: 1px solid red;
            }
        </style>
    </hend>
    <body>
        <div class="containter">
            <div class="left">左侧导航栏</div>
            <div class="main">中间主内容区</div>
            <div class="right">右侧导航栏</div>
        </div>
        <script>
        </script>
    </body>
</html>
