<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8"></meta>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
        <title>Grid三栏布局</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }

            .contain {
                /* 开启grid布局 */
                display: grid;
                grid-template-columns: 200px 1fr 200px;

            }
            .left, .right {
                width: 200px;
                height: 100px;

                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <div class="contain">
            <div class="left">左侧导航栏</div>
            <div class="center">中部内容区</div>
            <div class="right">右侧导航栏</div>
        </div>
    </body>
</html>
