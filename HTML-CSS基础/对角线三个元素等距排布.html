<!-- 
 对角线三个元素等距排布:（正方形盒子）
                A
                     B
                            C
三个点在 左上 → 右下对角线 上，并且等距分布 

实现方法1：绝对定位 position:absolute 
            (对角线本质实现：left = top)

正方形盒子
(0%,0%)      (100%,0%)


(0%,100%)    (100%,100%)

正中间：(50%,50%)，离左边/上边都是 50%

实现方式2: grid布局
-->
<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <title>对角线三个元素等距排布</title>
        <meta charset="utf-8"></meta>
        <style>
            * {
                padding: 0px;
                margin: 0px;
            }
            
            .box {
                width: 300px;
                height: 300px;
                background-color: skyblue;
                /* 父元素容器开启 相对定位 */
                position: relative;
            }
            .itemA { 
                /* 子元素开启绝对定位 */
                position: absolute;
                left: 0%;
                top: 0%;
            }
            .itemB {
                position: absolute;
                left: 50%;
                top: 50%;
            }
            .itemC {
                position: absolute;
                left: 100%;
                top: 100%;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <div class="itemA">A</div>
            <div class="itemB">B</div>
            <div class="itemC">C</div>
        </div>
    </body>

</html>
