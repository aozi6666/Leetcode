<!-- 
 对角线三个元素等距排布:（正方形盒子）
                A
                     B
                            C
三个点在 左上 → 右下对角线 上，并且等距分布 

实现方法1：绝对定位 position:absolute 
            (对角线本质实现：left = top)

正方形盒子
(0%,0%)      (100%,0%)


(0%,100%)    (100%,100%)

正中间：(50%,50%)，离左边/上边都是 50%

实现方式2: grid布局
-->
<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <title>对角线三个元素等距排布</title>
        <meta charset="utf-8"></meta>
        <style>
            * {
                padding: 0px;
                margin: 0px;
            }
            
            .box {
                width: 400px;
                height: 400px;
                background-color: skyblue;
                /* 父元素容器开启 相对定位 */
                position: relative;
            }
            .item {
                /* 子元素开启绝对定位(相对于父元素的相对定位容器) */
                position: absolute;
                /* 每个元素盒子默认左上角对齐，更改为中心点对齐 */
                /* translate(x, y)让元素自己：向右移动自身宽度， 向下移动自身高度 */
                transform: translate(-50%, -50%);
            }
            .itemA { 
                left: 0%;
                top: 0%;
            }
            /* 将B 这个 元素盒子 的左上角 放到父盒子的 50%,50% 位置 */
            .itemB {
                left: 50%;
                top: 50%;
            }
            .itemC {
                left: 100%;
                top: 100%;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <div class="item itemA">A</div>
            <div class="item itemB">B</div>
            <div class="item itemC">C</div>
        </div>
    </body>

</html>
